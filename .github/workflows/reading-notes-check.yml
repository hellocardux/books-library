name: Reading Notes staging build and validation
on:
  push:
    paths:
      - 'stage/insights/**'
      - '.github/workflows/reading-notes-check.yml'
  pull_request:
    paths:
      - 'stage/insights/**'
      - '.github/workflows/reading-notes-check.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  validate-staging:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install renderer
        run: python -m pip install -r stage/insights/requirements.txt
      - name: Generate missing staging articles only
        run: |
          python - <<'PY'
          import json, subprocess, sys
          from pathlib import Path
          root = Path("stage/insights")
          for item in json.loads((root / "catalog.json").read_text())["items"]:
              if item["status"] not in ("preview", "published"):
                  continue
              if (root / item["slug"] / "index.html").exists():
                  continue
              subprocess.run([sys.executable, str(root / "build.py"), "--write", "--slug", item["slug"]], check=True)
          PY
      - name: Validate Reading Notes pages
        run: python stage/insights/build.py --check
      - name: Save new pages to staging
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add 'stage/insights/*/index.html'
          if ! git diff --cached --quiet; then
            git commit -m "build(stage): render new reading notes previews"
            git push
          fi
