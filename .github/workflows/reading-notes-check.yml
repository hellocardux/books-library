name: Reading Notes staging validation
on:
  push:
    paths:
      - 'stage/insights/**'
      - '.github/workflows/reading-notes-check.yml'
  pull_request:
    paths:
      - 'stage/insights/**'
      - '.github/workflows/reading-notes-check.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate-staging:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install renderer
        run: python -m pip install -r stage/insights/requirements.txt
      - name: Validate generated Reading Notes pages
        run: python stage/insights/build.py --check
